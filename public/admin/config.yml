backend:
  name: github
  repo: pepsend/revista-literaria
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "posts"
    label: "Artículos"
    folder: "src/content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Imagen principal", name: "heroImage", widget: "image", required: false, hint: "Foto de portada que se muestra en la tarjeta y arriba del artículo." }
      - { label: "Encaje de la imagen", name: "imagePosition", widget: "focalpoint", required: false, default: "50% 50%", hint: "Arrastra la imagen con el mouse para elegir qué parte se ve en el marco de portada." }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - label: "Autor"
        name: "author"
        widget: "relation"
        collection: "authors"
        value_field: "name"
        search_fields: ["name"]
        display_fields: ["name"]
        required: false
        hint: "Empieza a escribir y te sugiere autores ya guardados. ¿Autor nuevo? Créalo antes en la sección «Autores» (con su bio) y aquí aparecerá."
      - { label: "Biografía del autor", name: "authorBio", widget: "text", required: false, hint: "Bio breve que aparece destacada al final del texto. Si la dejas vacía, se usa la que el autor tenga guardada en «Autores»." }
      - label: "Categoría"
        name: "category"
        widget: "select"
        options:
          - "Ensayo"
          - "Género"
          - "Crítica"
          - "Creación Abúlica"
          - "Poesía"
          - "Cuento"
          - "Crónica"
          - "Artículo"
      - label: "Contenido"
        name: "body"
        widget: "markdown"
        hint: "Usa el interruptor «Rich Text» (arriba a la derecha del editor) para el modo visual: negrita, cursiva, títulos, citas, listas, enlaces e insertar imágenes entre párrafos con el botón +."
        buttons:
          - bold
          - italic
          - code
          - link
          - heading-one
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
        editor_components:
          - image
          - code-block
      - { label: "Obras citadas", name: "citations", widget: "text", required: false, hint: "Bibliografía: una entrada por línea. Se muestra en un bloque aparte al final, distinto del cuerpo." }

  - name: "authors"
    label: "Autores"
    label_singular: "Autor"
    folder: "src/content/authors"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    summary: "{{name}}"
    fields:
      - { label: "Nombre", name: "name", widget: "string" }
      - { label: "Biografía", name: "body", widget: "markdown", required: false, hint: "Bio breve que aparece automáticamente al final de cada texto de este autor. Puedes incluir enlaces." }