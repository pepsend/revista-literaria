backend:
  name: github
  repo: pepsend/revista-literaria
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "posts"
    label: "Artículos"
    folder: "src/content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Imagen principal", name: "heroImage", widget: "image", required: false, hint: "Foto de portada que se muestra en la tarjeta y arriba del artículo." }
      - { label: "Encaje de la imagen", name: "imagePosition", widget: "focalpoint", required: false, default: "50% 50%", hint: "Arrastra la imagen con el mouse para elegir qué parte se ve en el marco de portada." }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Autor", name: "author", widget: "string" }
      - label: "Categoría"
        name: "category"
        widget: "select"
        options:
          - "Ensayo"
          - "Género"
          - "Crítica"
          - "Creación Abúlica"
          - "Poesía"
          - "Cuento"
          - "Crónica"
          - "Artículo"
      - { label: "Contenido", name: "body", widget: "markdown" }