backend:
  name: github
  repo: pepsend/revista-literaria
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

# Biblioteca de medios: Cloudinary. Subes desde tu PC (arrastrar/soltar),
# se previsualiza al instante y guarda la URL de la imagen. No expone el API Secret.
media_library:
  name: cloudinary
  config:
    cloud_name: cs8tnt88
    api_key: "319363133828178"

collections:
  - name: "posts"
    label: "Artículos"
    folder: "src/content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Imagen principal", name: "heroImage", widget: "image", required: false, hint: "Foto de portada que se muestra en la tarjeta y arriba del artículo." }
      - { label: "Encaje de la imagen", name: "imagePosition", widget: "focalpoint", required: false, default: "50% 50%", hint: "Arrastra la imagen con el mouse para elegir qué parte se ve en el marco de portada." }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Autor", name: "author", widget: "authorpicker", required: false, hint: "Escribe el nombre del autor: te sugiere los ya guardados y también puedes escribir uno nuevo. Guarda su bio en «Autores» o en el campo de abajo." }
      - label: "Categoría"
        name: "category"
        widget: "select"
        options:
          - "Cine"
          - "Reseña"
          - "Crítica"
          - "Género"
          - "Columna"
          - "Poesía"
          - "Novedades"
          - "Ensayo"
          - "Fotografía"
          - "Crónica"
          - "Creación Abúlica"
          - "Cuento"
          - "Artículo"
      - label: "Contenido"
        name: "body"
        widget: "markdown"
        hint: "Usa el interruptor «Rich Text» (arriba a la derecha del editor) para el modo visual: negrita, cursiva, títulos, citas, listas, enlaces e insertar imágenes entre párrafos con el botón +."
        buttons:
          - bold
          - italic
          - link
          - heading-one
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
        editor_components:
          - figura
          - alineado
          - cita
      - { label: "Texto justificado", name: "justify", widget: "boolean", default: true, hint: "Justifica el cuerpo del texto (como en Word). Actívalo o desactívalo cuando quieras. No afecta al bloque «Texto alineado» de los poemas." }
      - { label: "Etiquetas", name: "tags", widget: "list", required: false, hint: "Palabras clave por tema (ej.: memoria, ciudad, cine chileno). Enter para agregar cada una. Ayudan a relacionar y descubrir textos. Opcional." }
      - { label: "Biografía del autor", name: "authorBio", widget: "text", required: false, hint: "Bio breve que aparece destacada al final del texto. Si la dejas vacía, se usa la que el autor tenga guardada en «Autores»." }
      - { label: "Obras citadas", name: "citations", widget: "text", required: false, hint: "Bibliografía: una entrada por línea. Se muestra en un bloque aparte al final, distinto del cuerpo." }

  - name: "prensa"
    label: "Prensa"
    label_singular: "Novedad"
    folder: "src/content/prensa"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string", hint: "Título del comunicado o novedad literaria." }
      - label: "Tipo / Etiqueta"
        name: "type"
        widget: "select"
        options:
          - "Lanzamiento"
          - "Convocatoria"
          - "Feria"
          - "Seminario"
          - "Noticia"
          - "Evento"
          - "Premio"
        default: "Lanzamiento"
        hint: "Define la etiqueta y clasificación de la novedad."
      - { label: "Fecha de publicación", name: "date", widget: "datetime" }
      - { label: "Autor / Autora (opcional)", name: "author", widget: "string", required: false, hint: "Nombre del autor/a de la obra o expositor/a si aplica (ej: Elena Montes Lira)." }
      - { label: "Rango de fechas / Cuándo ocurre", name: "eventDates", widget: "string", required: false, hint: "Ej: '15 al 20 de noviembre' o 'Hasta el 30 nov'" }
      - { label: "Editorial u Organización / Entidad", name: "location", widget: "string", required: false, hint: "Si es libro: nombre de la editorial (ej: Editorial Cuarto Propio). Si es evento: entidad o lugar (ej: Estación Mapocho, Fondo del Libro)." }
      - { label: "Enlace oficial o compra", name: "link", widget: "string", required: false, hint: "Enlace a bases, inscripción o compra." }
      - { label: "Afiche o Portada", name: "heroImage", widget: "image", required: false, hint: "Afiche del evento o portada del libro." }
      - { label: "Encaje de la imagen", name: "imagePosition", widget: "focalpoint", required: false, default: "50% 50%", hint: "Arrastra para centrar la imagen." }
      - { label: "Bajada breve para el Home", name: "summary", widget: "text", required: false, hint: "Resumen breve (1 a 2 líneas) para la gaceta del Home." }
      - label: "Contenido completo"
        name: "body"
        widget: "markdown"
        hint: "Texto íntegro de la nota o comunicado de prensa."
        buttons:
          - bold
          - italic
          - link
          - heading-one
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list

  - name: "authors"
    label: "Autores"
    label_singular: "Autor"
    folder: "src/content/authors"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    summary: "{{name}}"
    fields:
      - { label: "Nombre", name: "name", widget: "string" }
      - { label: "Biografía", name: "body", widget: "markdown", required: false, hint: "Bio breve que aparece automáticamente al final de cada texto de este autor. Puedes incluir enlaces." }