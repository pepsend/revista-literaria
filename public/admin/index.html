<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>abulia terminal — panel</title>
    <style>
      .focal-empty {
        padding: 0.9rem 1rem;
        border: 2px dashed #b9ad97;
        color: #8c7f6e;
        font-size: 13px;
      }
      .focal-box {
        position: relative;
        width: 100%;
        max-width: 560px;
        aspect-ratio: 16 / 9;
        background-size: cover;
        background-repeat: no-repeat;
        border: 2px solid #1b1916;
        cursor: move;
        user-select: none;
        touch-action: none;
      }
      .focal-dot {
        position: absolute;
        width: 20px;
        height: 20px;
        margin: -10px 0 0 -10px;
        border-radius: 50%;
        border: 2px solid #fff;
        box-shadow: 0 0 0 2px #e5468a, 0 1px 4px rgba(0, 0, 0, 0.5);
        background: rgba(229, 70, 138, 0.45);
        pointer-events: none;
      }
      .focal-hint {
        margin: 8px 0 0;
        font-size: 12px;
        color: #6b6152;
        font-family: 'Space Mono', ui-monospace, monospace;
      }
      .focal-hint b {
        color: #e5468a;
      }
      .car-drop {
        padding: 1rem;
        border: 2px dashed #b9ad97;
        background: #fbf8ef;
        color: #4a4338;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .car-drop:hover,
      .car-drop:focus-visible,
      .car-drop--busy {
        border-color: #e5468a;
        background: #fff6fa;
        outline: none;
      }
      .car-drop--busy {
        cursor: wait;
      }
      .car-drop-title {
        display: block;
        font-size: 14px;
        font-weight: 700;
      }
      .car-drop-hint {
        display: block;
        margin-top: 4px;
        font-size: 12px;
        color: #8c7f6e;
      }
      .car-error {
        margin: 8px 0 0;
        font-size: 12px;
        color: #b00020;
      }
      .car-list {
        list-style: none;
        display: grid;
        gap: 0.75rem;
        margin: 1rem 0 0;
        padding: 0;
      }
      .car-item {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr) auto;
        gap: 0.75rem;
        align-items: start;
        padding: 0.75rem;
        border: 1px solid #d8ccb6;
        background: #fff;
      }
      .car-thumb {
        display: block;
        width: 96px;
        height: 72px;
        object-fit: cover;
        border: 1px solid #1b1916;
        background: #f2ecdf;
      }
      .car-thumb--empty {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4px;
        font-size: 10px;
        line-height: 1.25;
        color: #8c7f6e;
        text-align: center;
      }
      .car-fields {
        min-width: 0;
      }
      .car-file {
        margin-bottom: 4px;
        overflow-wrap: anywhere;
        font-family: 'Space Mono', ui-monospace, monospace;
        font-size: 10px;
        color: #8c7f6e;
      }
      .car-label {
        display: block;
        margin: 0.35rem 0 0.15rem;
        font-size: 11px;
        font-weight: 700;
        color: #4a4338;
      }
      .car-input {
        width: 100%;
        padding: 0.4rem 0.5rem;
        font-size: 13px;
        border: 1px solid #c9c0ad;
        border-radius: 3px;
        background: #fff;
      }
      .car-actions {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .car-action {
        width: 28px;
        height: 26px;
        padding: 0;
        font-size: 12px;
        line-height: 1;
        border: 1px solid #c9c0ad;
        background: #fbf8ef;
        cursor: pointer;
      }
      .car-action:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .car-action--remove:hover {
        color: #fff;
        background: #e5468a;
        border-color: #e5468a;
      }
      .car-empty {
        margin: 1rem 0 0;
        font-size: 12px;
        color: #8c7f6e;
      }
      @media (max-width: 560px) {
        .car-item {
          grid-template-columns: 72px minmax(0, 1fr);
        }
        .car-thumb {
          width: 72px;
          height: 54px;
        }
        .car-actions {
          grid-column: 1 / -1;
          flex-direction: row;
          justify-content: flex-end;
        }
      }
      /* Área de edición: asegurar que el cuerpo editable abarque todo el bloque para permitir clic derecho (Pegar) */
      .cms-editor-visual [contenteditable="true"],
      .cms-editor-raw [contenteditable="true"] {
        min-height: 260px;
        cursor: text;
      }
    </style>
  </head>
  <body>
    <script>
      /* ---------- Parche de compatibilidad de pegado (Paste) para Decap CMS / Slate ----------
       * Problema: al editar notas existentes, el deserializador HTML de Slate en Decap CMS
       * falla al procesar etiquetas como <span> con estilos o <div> (comunes al copiar desde
       * Safari, Chrome, Google Docs, Word o la web). Al arrojar excepción sin try/catch,
       * el evento de pegado se aborta por completo y no pega nada.
       * Además, en Safari, al hacer clic derecho en el espacio inferior del editor, el menú
       * "Pegar" quedaba deshabilitado porque el contenedor inferior no era contenteditable.
       *
       * Solución:
       * 1) Sanitizar el HTML entrante de DataTransfer.prototype.getData para convertir <div> a <p>,
       *    desenvolver <span> de bloques y garantizar una estructura compatible con Slate.
       *    Si algo falla, devuelve "" para activar el respaldo nativo y seguro de texto plano.
       * 2) Mantener el área editable con min-height y reenfocar al hacer clic/clic derecho en el área vacía.
       */
      (function () {
        if (typeof window !== 'undefined' && window.DataTransfer && window.DataTransfer.prototype) {
          var originalGetData = window.DataTransfer.prototype.getData;
          window.DataTransfer.prototype.getData = function (format) {
            var raw = originalGetData.call(this, format);
            if (format && String(format).toLowerCase() === 'text/html' && raw) {
              try {
                // Si es un fragmento nativo de Slate copiado dentro de la misma aplicación, no tocarlo
                if (raw.indexOf('data-slate-fragment') !== -1) return raw;

                var doc = new DOMParser().parseFromString(raw, 'text/html');
                if (!doc || !doc.body) return '';

                // 1. Eliminar etiquetas propietarias o basura
                var bad = doc.body.querySelectorAll('script, style, meta, link, noscript, o\\:p, xml');
                for (var i = 0; i < bad.length; i++) {
                  if (bad[i].parentNode) bad[i].parentNode.removeChild(bad[i]);
                }

                // 2. Desenvolver <span> que envuelven bloques
                var spans = doc.body.querySelectorAll('span');
                for (var s = spans.length - 1; s >= 0; s--) {
                  var sp = spans[s];
                  if (sp.querySelector('p, div, h1, h2, h3, h4, h5, h6, ul, ol, blockquote')) {
                    while (sp.firstChild) sp.parentNode.insertBefore(sp.firstChild, sp);
                    sp.parentNode.removeChild(sp);
                  }
                }

                // 3. Convertir <div> a <p>
                var divs = doc.body.querySelectorAll('div');
                for (var d = 0; d < divs.length; d++) {
                  var div = divs[d];
                  var p = doc.createElement('p');
                  while (div.firstChild) p.appendChild(div.firstChild);
                  if (div.parentNode) div.parentNode.replaceChild(p, div);
                }

                // 4. Envolver texto o inlines huérfanos directamente bajo body en <p>
                var child = doc.body.firstChild;
                var curP = null;
                while (child) {
                  var next = child.nextSibling;
                  var isBlk = child.nodeType === 1 && /^(P|H[1-6]|BLOCKQUOTE|UL|OL|PRE|FIGURE)$/i.test(child.nodeName);
                  if (!isBlk) {
                    if (!curP) {
                      curP = doc.createElement('p');
                      doc.body.insertBefore(curP, child);
                    }
                    curP.appendChild(child);
                  } else {
                    curP = null;
                  }
                  child = next;
                }

                return doc.body.innerHTML || '';
              } catch (e) {
                // Ante cualquier error, retornar vacío para que Decap CMS use text/plain
                return '';
              }
            }
            return raw;
          };
        }

        // Asegurar que clic o clic derecho debajo del texto en el editor enfoque y habilite 'Pegar'
        function placeCursorAtEnd(container) {
          if (!container) return;
          var editable = container.querySelector('[contenteditable="true"]');
          if (!editable) return;
          editable.focus();
          try {
            var sel = window.getSelection();
            if (sel) {
              var range = document.createRange();
              range.selectNodeContents(editable);
              range.collapse(false);
              sel.removeAllRanges();
              sel.addRange(range);
            }
          } catch (e) {}
        }

        document.addEventListener('mousedown', function (e) {
          var container = e.target && e.target.closest && e.target.closest('.cms-editor-visual, .cms-editor-raw');
          if (!container) return;
          var editable = container.querySelector('[contenteditable="true"]');
          if (editable && !editable.contains(e.target)) {
            placeCursorAtEnd(container);
          }
        }, true);

        document.addEventListener('contextmenu', function (e) {
          var container = e.target && e.target.closest && e.target.closest('.cms-editor-visual, .cms-editor-raw');
          if (!container) return;
          var editable = container.querySelector('[contenteditable="true"]');
          if (editable && !editable.contains(e.target)) {
            placeCursorAtEnd(container);
          }
        }, true);
      })();
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      /* ---------- Utilidad: resolver la URL de un asset (aunque no esté publicado) ---------- */
      function resolveAsset(getAsset, path, cb) {
        if (!path) {
          cb('');
          return;
        }
        // URLs absolutas (Cloudinary, blobs, data): se usan tal cual.
        if (/^(https?:|blob:|data:)/i.test(path)) {
          cb(path);
          return;
        }
        try {
          var a = getAsset ? getAsset(path) : path;
          Promise.resolve(a).then(
            function (res) {
              var u = res && res.toString ? res.toString() : res && res.url ? res.url : res;
              cb(u || path);
            },
            function () {
              cb(path);
            }
          );
        } catch (e) {
          cb(path);
        }
      }

      /* ---------- Widget "focalpoint": arrastrar la imagen con el mouse ---------- */
      var FocalControl = createClass({
        getInitialState: function () {
          return { url: '' };
        },
        componentDidMount: function () {
          this._resolve();
          // El control no siempre se re-renderiza cuando cambia la imagen principal
          // (campo hermano). Revisamos periódicamente para tomarla apenas se sube.
          var self = this;
          this._poll = setInterval(function () {
            if (self._heroPath() !== self._lastPath) self._resolve();
          }, 600);
        },
        componentWillUnmount: function () {
          if (this._poll) clearInterval(this._poll);
        },
        componentDidUpdate: function () {
          if (this._heroPath() !== this._lastPath) this._resolve();
        },
        _heroPath: function () {
          try {
            return this.props.entry.getIn(['data', 'heroImage']) || '';
          } catch (e) {
            return '';
          }
        },
        _resolve: function () {
          var self = this;
          var path = this._heroPath();
          this._lastPath = path;
          resolveAsset(this.props.getAsset, path, function (u) {
            self.setState({ url: u });
          });
        },
        _pos: function () {
          var v = this.props.value || '50% 50%';
          var m = /(-?[\d.]+)%\s+(-?[\d.]+)%/.exec(v);
          if (m) return { x: parseFloat(m[1]), y: parseFloat(m[2]) };
          if (v === 'top') return { x: 50, y: 0 };
          if (v === 'bottom') return { x: 50, y: 100 };
          if (v === 'left') return { x: 0, y: 50 };
          if (v === 'right') return { x: 100, y: 50 };
          return { x: 50, y: 50 };
        },
        _set: function (clientX, clientY) {
          if (!this._box) return;
          var rect = this._box.getBoundingClientRect();
          var x = Math.min(100, Math.max(0, ((clientX - rect.left) / rect.width) * 100));
          var y = Math.min(100, Math.max(0, ((clientY - rect.top) / rect.height) * 100));
          this.props.onChange(Math.round(x) + '% ' + Math.round(y) + '%');
        },
        _down: function (e) {
          this._dragging = true;
          this._set(e.clientX, e.clientY);
          e.preventDefault();
        },
        _move: function (e) {
          if (this._dragging) this._set(e.clientX, e.clientY);
        },
        _up: function () {
          this._dragging = false;
        },
        render: function () {
          var self = this;
          var p = this._pos();
          if (!this.state.url) {
            return h(
              'div',
              { className: 'focal-empty' },
              'Sube primero la “imagen principal” para poder posicionarla.'
            );
          }
          return h('div', { className: 'focal' }, [
            h(
              'div',
              {
                key: 'box',
                className: 'focal-box',
                ref: function (el) {
                  self._box = el;
                },
                onMouseDown: this._down,
                onMouseMove: this._move,
                onMouseUp: this._up,
                onMouseLeave: this._up,
                style: {
                  backgroundImage: 'url(' + this.state.url + ')',
                  backgroundPosition: p.x + '% ' + p.y + '%',
                },
              },
              h('div', { className: 'focal-dot', style: { left: p.x + '%', top: p.y + '%' } })
            ),
            h(
              'p',
              { key: 'hint', className: 'focal-hint' },
              [
                'Arrastra sobre la imagen para elegir qué parte se ve · ',
                h('b', { key: 'v' }, Math.round(p.x) + '% ' + Math.round(p.y) + '%'),
              ]
            ),
          ]);
        },
      });
      CMS.registerWidget('focalpoint', FocalControl);

      /* ---------- Widget "authorpicker": escribir libre + sugerir guardados ---------- */
      var AuthorPicker = createClass({
        getInitialState: function () {
          return { names: [] };
        },
        componentDidMount: function () {
          var self = this;
          fetch('/authors.json')
            .then(function (r) {
              return r.json();
            })
            .then(function (list) {
              if (Array.isArray(list)) self.setState({ names: list });
            })
            .catch(function () {});
        },
        _change: function (e) {
          this.props.onChange(e.target.value);
        },
        render: function () {
          var listId = 'at-authors-list';
          return h('div', {}, [
            h('input', {
              key: 'inp',
              type: 'text',
              value: this.props.value || '',
              onChange: this._change,
              list: listId,
              placeholder: 'Escribe el nombre del autor…',
              style: {
                width: '100%',
                padding: '0.55rem 0.65rem',
                fontSize: '15px',
                border: '1px solid #c9c0ad',
                borderRadius: '4px',
                background: '#fff',
              },
            }),
            h(
              'datalist',
              { key: 'dl', id: listId },
              this.state.names.map(function (n, i) {
                return h('option', { key: i, value: n });
              })
            ),
          ]);
        },
      });
      CMS.registerWidget('authorpicker', AuthorPicker);

      /* ---------- Widget "carousel": subir varias fotos de una sola vez ---------- */
      var carouselMediaFile = function (result) {
        var payload = result && result.payload;
        if (!payload) return null;
        var get = function (obj, key) {
          return obj && typeof obj.get === 'function' ? obj.get(key) : obj[key];
        };
        var file = payload;
        if (!get(payload, 'path')) {
          var nested = get(payload, 'file');
          if (nested && get(nested, 'path')) file = nested;
        }
        if (file && typeof file.get === 'function') {
          return { path: file.get('path'), url: file.get('url'), name: file.get('name') };
        }
        return file;
      };

      var carouselPublicPath = function (filePath) {
        var path = String(filePath || '');
        if (!path) return '';
        if (/^(https?:)?\/\//i.test(path)) return path;
        path = path.replace(/\\/g, '/').replace(/^\/+/, '');
        path = path.replace(/^public\//, '').replace(/^uploads\//, '');
        return '/uploads/' + path;
      };

      var CarouselThumb = createClass({
        getInitialState: function () {
          return { src: '' };
        },
        componentDidMount: function () {
          this._mounted = true;
          this._resolve();
        },
        componentWillUnmount: function () {
          this._mounted = false;
        },
        componentDidUpdate: function (prev) {
          if (prev.path !== this.props.path || prev.preview !== this.props.preview) this._resolve();
        },
        _resolve: function () {
          var self = this;
          if (this.props.preview) {
            this.setState({ src: this.props.preview });
            return;
          }
          resolveAsset(this.props.getAsset, this.props.path, function (url) {
            if (self._mounted) self.setState({ src: url });
          });
        },
        render: function () {
          var src = this.state.src || this.props.preview || '';
          return src
            ? h('img', { className: 'car-thumb', src: src, alt: '' })
            : h('div', { className: 'car-thumb car-thumb--empty' }, 'vista previa al guardar');
        },
      });

      var CarouselControl = createClass({
        getInitialState: function () {
          return { uploading: 0, error: '', previews: {} };
        },
        _items: function () {
          var value = this.props.value;
          if (value && typeof value.toJS === 'function') value = value.toJS();
          if (!Array.isArray(value)) return [];
          return value
            .map(function (item) {
              if (typeof item === 'string') return { image: item, caption: '', alt: '' };
              return {
                image: (item && item.image) || '',
                caption: (item && item.caption) || '',
                alt: (item && item.alt) || '',
              };
            })
            .filter(function (item) {
              return !!item.image;
            });
        },
        _emit: function (items) {
          var clean = items.map(function (item) {
            var out = { image: item.image };
            if (item.caption) out.caption = item.caption;
            if (item.alt) out.alt = item.alt;
            return out;
          });
          this.props.onChange(clean);
        },
        _setField: function (index, key, value) {
          var items = this._items();
          if (!items[index]) return;
          items[index][key] = value;
          this._emit(items);
        },
        _move: function (index, delta) {
          var items = this._items();
          var target = index + delta;
          if (target < 0 || target >= items.length) return;
          var moved = items.splice(index, 1)[0];
          items.splice(target, 0, moved);
          this._emit(items);
        },
        _remove: function (index) {
          var items = this._items();
          items.splice(index, 1);
          this._emit(items);
        },
        _onPick: function (e) {
          this._upload(e.target.files);
          e.target.value = '';
        },
        _onDrop: function (e) {
          e.preventDefault();
          e.stopPropagation();
          if (e.dataTransfer && e.dataTransfer.files) this._upload(e.dataTransfer.files);
        },
        _upload: function (fileList) {
          var self = this;
          if (this.state.uploading) return;
          var files = Array.prototype.slice.call(fileList || []).filter(function (file) {
            return /^image\//.test(file.type);
          });
          if (!files.length) return;
          var items = this._items();
          var previews = Object.assign({}, this.state.previews);
          this.setState({ uploading: files.length, error: '' });
          var pending = files.length;
          var chain = Promise.resolve();
          files.forEach(function (file) {
            chain = chain
              .then(function () {
                return Promise.resolve(
                  self.props.onPersistMedia(file, { field: self.props.field })
                ).then(function (result) {
                  var mediaFile = carouselMediaFile(result);
                  if (!mediaFile || !mediaFile.path) {
                    if (result) throw new Error('No se pudo guardar la foto');
                    return;
                  }
                  var path = carouselPublicPath(mediaFile.path);
                  if (mediaFile.url) previews[path] = mediaFile.url;
                  items = items.concat([{ image: path, caption: '', alt: '' }]);
                  self.setState({ previews: Object.assign({}, previews) });
                  self._emit(items);
                });
              })
              .catch(function (error) {
                console.error('No se pudo subir la foto al carrusel:', file.name, error);
                self.setState({
                  error: 'No se pudo subir “' + file.name + '”. Intenta de nuevo.',
                });
              })
              .then(function () {
                pending -= 1;
                if (pending === 0) self.setState({ uploading: 0 });
              });
          });
        },
        render: function () {
          var self = this;
          var items = this._items();
          var uploading = this.state.uploading > 0;
          return h('div', { className: 'car-widget' }, [
            h('input', {
              key: 'file',
              type: 'file',
              accept: 'image/*',
              multiple: true,
              ref: function (el) {
                self._fileInput = el;
              },
              style: { display: 'none' },
              onChange: this._onPick,
            }),
            h(
              'div',
              {
                key: 'drop',
                className: 'car-drop' + (uploading ? ' car-drop--busy' : ''),
                role: 'button',
                tabIndex: 0,
                onClick: function () {
                  if (!uploading && self._fileInput) self._fileInput.click();
                },
                onKeyDown: function (e) {
                  if ((e.key === 'Enter' || e.key === ' ') && !uploading && self._fileInput) {
                    e.preventDefault();
                    self._fileInput.click();
                  }
                },
                onDragEnter: function (e) {
                  e.preventDefault();
                  e.stopPropagation();
                },
                onDragOver: function (e) {
                  e.preventDefault();
                  e.stopPropagation();
                },
                onDrop: this._onDrop,
              },
              [
                h(
                  'span',
                  { key: 'title', className: 'car-drop-title' },
                  uploading
                    ? 'Subiendo fotos…'
                    : 'Arrastra varias fotos aquí o haz clic para elegirlas'
                ),
                h(
                  'span',
                  { key: 'hint', className: 'car-drop-hint' },
                  'Puedes seleccionar todas de una vez con Ctrl o Shift. Se agregan al carrusel en el orden elegido.'
                ),
              ]
            ),
            this.state.error
              ? h('p', { key: 'error', className: 'car-error' }, this.state.error)
              : null,
            items.length
              ? h(
                  'ol',
                  { key: 'list', className: 'car-list' },
                  items.map(function (item, index) {
                    return h('li', { key: item.image + '-' + index, className: 'car-item' }, [
                      h(
                        'div',
                        { key: 'thumb', className: 'car-thumb-wrap' },
                        h(CarouselThumb, {
                          path: item.image,
                          preview: self.state.previews[item.image],
                          getAsset: self.props.getAsset,
                        })
                      ),
                      h('div', { key: 'fields', className: 'car-fields' }, [
                        h('div', { key: 'file', className: 'car-file' }, item.image.split('/').pop()),
                        h('label', { key: 'caption-label', className: 'car-label' }, 'Pie de foto'),
                        h('input', {
                          key: 'caption',
                          className: 'car-input',
                          type: 'text',
                          value: item.caption,
                          placeholder: 'Opcional',
                          onChange: function (e) {
                            self._setField(index, 'caption', e.target.value);
                          },
                        }),
                        h('label', { key: 'alt-label', className: 'car-label' }, 'Texto alternativo'),
                        h('input', {
                          key: 'alt',
                          className: 'car-input',
                          type: 'text',
                          value: item.alt,
                          placeholder: 'Describe la foto para lectores de pantalla',
                          onChange: function (e) {
                            self._setField(index, 'alt', e.target.value);
                          },
                        }),
                      ]),
                      h('div', { key: 'actions', className: 'car-actions' }, [
                        h(
                          'button',
                          {
                            key: 'up',
                            type: 'button',
                            className: 'car-action',
                            title: 'Mover arriba',
                            'aria-label': 'Mover arriba',
                            disabled: index === 0,
                            onClick: function () {
                              self._move(index, -1);
                            },
                          },
                          '↑'
                        ),
                        h(
                          'button',
                          {
                            key: 'down',
                            type: 'button',
                            className: 'car-action',
                            title: 'Mover abajo',
                            'aria-label': 'Mover abajo',
                            disabled: index === items.length - 1,
                            onClick: function () {
                              self._move(index, 1);
                            },
                          },
                          '↓'
                        ),
                        h(
                          'button',
                          {
                            key: 'remove',
                            type: 'button',
                            className: 'car-action car-action--remove',
                            title: 'Quitar foto',
                            'aria-label': 'Quitar foto',
                            onClick: function () {
                              self._remove(index);
                            },
                          },
                          '×'
                        ),
                      ]),
                    ]);
                  })
                )
              : h(
                  'p',
                  { key: 'empty', className: 'car-empty' },
                  'Todavía no hay fotos en este carrusel.'
                ),
          ]);
        },
      });
      CMS.registerWidget('carousel', CarouselControl);

      /* ---------- Editor component "figura": imagen del cuerpo con ancho, alineación y pie ---------- */
      var normWidth = function (w) {
        w = (w == null ? '' : String(w)).trim();
        if (!w) return '100%';
        if (/^\d+(\.\d+)?$/.test(w)) return w + '%';
        return w;
      };
      var marginFor = function (align) {
        if (align === 'izquierda') return '1.8rem auto 1.8rem 0';
        if (align === 'derecha') return '1.8rem 0 1.8rem auto';
        return '1.8rem auto';
      };
      var escAttr = function (s) {
        return String(s || '')
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      };
      var escHtml = function (s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      };
      CMS.registerEditorComponent({
        id: 'figura',
        label: 'Figura (imagen)',
        fields: [
          { name: 'image', label: 'Imagen', widget: 'image' },
          { name: 'caption', label: 'Pie de foto / título (opcional)', widget: 'string', required: false },
          {
            name: 'width',
            label: 'Ancho',
            widget: 'string',
            default: '100%',
            required: false,
            hint: 'Porcentaje del ancho del texto. 100% = completo, 60% = más chica.',
          },
          {
            name: 'align',
            label: 'Alineación',
            widget: 'select',
            options: ['izquierda', 'centro', 'derecha'],
            default: 'centro',
            required: false,
          },
        ],
        pattern: /^<figure data-fig[\s\S]*?<\/figure>/,
        fromBlock: function (match) {
          var s = match[0];
          var src = (s.match(/<img[^>]*src="([^"]*)"/) || [])[1] || '';
          var cap = (s.match(/<figcaption>([\s\S]*?)<\/figcaption>/) || [])[1] || '';
          var width = (s.match(/width:\s*([^;"']+)/) || [])[1] || '100%';
          var align = (s.match(/data-align="([^"]*)"/) || [])[1] || 'centro';
          cap = cap.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
          return { image: src, caption: cap, width: width.trim(), align: align };
        },
        toBlock: function (obj) {
          var src = obj.image || '';
          var cap = obj.caption || '';
          var width = normWidth(obj.width);
          var align = obj.align || 'centro';
          var figcap = cap ? '<figcaption>' + escHtml(cap) + '</figcaption>' : '';
          return (
            '<figure data-fig data-align="' +
            align +
            '" style="width:' +
            width +
            ';margin:' +
            marginFor(align) +
            ';"><img src="' +
            src +
            '" alt="' +
            escAttr(cap) +
            '" />' +
            figcap +
            '</figure>'
          );
        },
        toPreview: function (obj) {
          var src = obj.image || '';
          var cap = obj.caption || '';
          var width = normWidth(obj.width);
          var align = obj.align || 'centro';
          var figcap = cap
            ? '<figcaption style="font-family:\'Space Mono\',monospace;font-size:0.75rem;color:#8c7f6e;margin-top:0.4rem;text-align:center;">' +
              escHtml(cap) +
              '</figcaption>'
            : '';
          return (
            '<figure data-fig data-align="' +
            align +
            '" style="width:' +
            width +
            ';margin:' +
            marginFor(align) +
            ';"><img src="' +
            src +
            '" alt="' +
            escAttr(cap) +
            '" style="width:100%;height:auto;display:block;border:2px solid #1b1916;" />' +
            figcap +
            '</figure>'
          );
        },
      });

      /* ---------- Editor component "alineado": texto con alineación (tipo Word) ---------- */
      var alignCss = function (a) {
        return { izquierda: 'left', centro: 'center', derecha: 'right', justificado: 'justify' }[a] || 'center';
      };
      var fmtAln_ = function (t) {
        var s = String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
        s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>').replace(/_([^_\n]+)_/g, '<em>$1</em>');
        return s.replace(/\r\n/g, '\n').replace(/\n/g, '<br>');
      };
      CMS.registerEditorComponent({
        id: 'alineado',
        label: 'Texto alineado',
        fields: [
          {
            name: 'text',
            label: 'Texto',
            widget: 'text',
            hint: 'Escribe el texto y elige la alineación. Para dar formato: **negrita** (con doble asterisco) y *cursiva* (con un asterisco). Se respetan los saltos de línea.',
          },
          {
            name: 'align',
            label: 'Alineación',
            widget: 'select',
            options: ['izquierda', 'centro', 'derecha', 'justificado'],
            default: 'centro',
            required: false,
          },
        ],
        pattern: /^<div class="aln"[\s\S]*?<\/div>/,
        fromBlock: function (match) {
          var s = match[0];
          var align = (s.match(/data-align="([^"]*)"/) || [])[1] || 'centro';
          var inner = (s.match(/>([\s\S]*)<\/div>\s*$/) || [])[1] || '';
          var text = inner
            .replace(/<br\s*\/?>/gi, '\n')
            .replace(/<strong>([\s\S]*?)<\/strong>/gi, '**$1**')
            .replace(/<em>([\s\S]*?)<\/em>/gi, '*$1*')
            .replace(/&lt;/g, '<')
            .replace(/&gt;/g, '>')
            .replace(/&amp;/g, '&');
          return { text: text, align: align };
        },
        toBlock: function (obj) {
          var align = obj.align || 'centro';
          var html = fmtAln_(obj.text);
          return (
            '<div class="aln" data-aln data-align="' +
            align +
            '" style="text-align:' +
            alignCss(align) +
            ';white-space:pre-wrap;">' +
            html +
            '</div>'
          );
        },
        toPreview: function (obj) {
          var align = obj.align || 'centro';
          var html = fmtAln_(obj.text);
          return (
            '<div class="aln" data-aln data-align="' +
            align +
            '" style="text-align:' +
            alignCss(align) +
            ';white-space:pre-wrap;margin:2rem 0;line-height:1.6;">' +
            html +
            '</div>'
          );
        },
      });

      /* ---------- Editor component "cita": cita destacada (pull quote) ---------- */
      CMS.registerEditorComponent({
        id: 'cita',
        label: 'Cita destacada',
        fields: [
          {
            name: 'text',
            label: 'Cita',
            widget: 'text',
            hint: 'La frase a resaltar en grande. Puedes usar **negrita** y *cursiva*. Se respetan los saltos de línea.',
          },
          {
            name: 'autor',
            label: 'Autor / fuente',
            widget: 'string',
            required: false,
            hint: 'Opcional: a quién se atribuye la cita.',
          },
        ],
        pattern: /^<blockquote class="pullquote"[\s\S]*?<\/blockquote>/,
        fromBlock: function (match) {
          var s = match[0];
          var autor = (s.match(/<cite>[—\s]*([\s\S]*?)<\/cite>/) || [])[1] || '';
          var inner = (s.match(/<p>([\s\S]*?)<\/p>/) || [])[1] || '';
          var text = inner
            .replace(/<br\s*\/?>/gi, '\n')
            .replace(/<strong>([\s\S]*?)<\/strong>/gi, '**$1**')
            .replace(/<em>([\s\S]*?)<\/em>/gi, '*$1*')
            .replace(/&lt;/g, '<')
            .replace(/&gt;/g, '>')
            .replace(/&amp;/g, '&');
          return { text: text, autor: autor };
        },
        toBlock: function (obj) {
          var html = fmtAln_(obj.text);
          var a = String(obj.autor == null ? '' : obj.autor)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
          var cite = a ? '<cite>— ' + a + '</cite>' : '';
          return '<blockquote class="pullquote" data-pq><p>' + html + '</p>' + cite + '</blockquote>';
        },
        toPreview: function (obj) {
          var html = fmtAln_(obj.text);
          var cite = obj.autor
            ? '<cite style="display:block;font-family:\'Space Mono\',monospace;font-size:0.8rem;color:#8c7f6e;margin-top:0.6rem;font-style:normal;">— ' +
              obj.autor +
              '</cite>'
            : '';
          return (
            '<blockquote class="pullquote" style="border-left:4px solid #e5468a;margin:2rem 0;padding-left:1.2rem;font-family:\'Fraunces\',serif;font-weight:900;font-style:italic;font-size:1.7rem;line-height:1.2;color:#1b1916;">' +
            '<p style="margin:0;">' +
            html +
            '</p>' +
            cite +
            '</blockquote>'
          );
        },
      });

      /* ---------- Editor component "subtitulo": subtitulo de seccion ---------- */
      var escSub_ = function (t) {
        return String(t == null ? '' : t)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      };
      CMS.registerEditorComponent({
        id: 'subtitulo',
        label: 'Subtitulo',
        fields: [
          {
            name: 'text',
            label: 'Subtitulo',
            widget: 'string',
            hint: 'Titulo de una seccion dentro del articulo. Va centrado y en cursiva, mas grande que el cuerpo.',
          },
        ],
        pattern: /^<p class="art-sub"[\s\S]*?<\/p>/,
        fromBlock: function (match) {
          var inner = (match[0].match(/>([\s\S]*?)<\/p>\s*$/) || [])[1] || '';
          var text = inner
            .replace(/<br\s*\/?>/gi, ' ')
            .replace(/&lt;/g, '<')
            .replace(/&gt;/g, '>')
            .replace(/&amp;/g, '&');
          return { text: text };
        },
        toBlock: function (obj) {
          return '<p class="art-sub" data-sub>' + escSub_(obj.text) + '</p>';
        },
        toPreview: function (obj) {
          return (
            '<p class="art-sub" style="font-family:\'Fraunces\',Georgia,serif;font-weight:600;font-style:italic;font-size:1.4em;line-height:1.25;text-align:center;color:#1b1916;margin:2.9rem 0 1.4rem;">' +
            escSub_(obj.text) +
            '</p>'
          );
        },
      });

      /* ---------- Estilos reales del sitio en la vista previa ---------- */
      CMS.registerPreviewStyle(
        'https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,900;1,9..144,900&family=Space+Mono:wght@400;700&display=swap'
      );
      CMS.registerPreviewStyle('/admin/preview.css');

      /* ---------- Imagen del preview (visible sin publicar) con el encaje elegido ---------- */
      var HeroImg = createClass({
        getInitialState: function () {
          return { url: '' };
        },
        componentDidMount: function () {
          this._resolve(this.props.path);
        },
        componentDidUpdate: function (prev) {
          if (prev.path !== this.props.path) this._resolve(this.props.path);
        },
        _resolve: function (path) {
          var self = this;
          resolveAsset(this.props.getAsset, path, function (u) {
            self.setState({ url: u });
          });
        },
        render: function () {
          if (!this.state.url) {
            return h('div', { className: 'pv-hero pv-hero--empty' }, 'sin imagen de portada');
          }
          return h(
            'div',
            { className: 'pv-hero' },
            h('img', {
              src: this.state.url,
              alt: '',
              style: { objectPosition: this.props.position || 'center' },
            })
          );
        },
      });

      var PostPreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var data = entry.get('data');
          var title = data.get('title');
          var author = data.get('author');
          var category = data.get('category');
          var date = data.get('date');
          var pos = data.get('imagePosition') || 'center';
          var hero = data.get('heroImage');
          var authorBio = data.get('authorBio');
          var bioLines = authorBio
            ? String(authorBio)
                .split(/\r?\n+/)
                .map(function (s) {
                  return s.trim();
                })
                .filter(Boolean)
            : [];
          var citations = data.get('citations');
          var citeLines = citations
            ? String(citations)
                .split(/\r?\n+/)
                .map(function (s) {
                  return s.trim();
                })
                .filter(Boolean)
            : [];

          var dateStr = '';
          try {
            dateStr = date
              ? new Date(date).toLocaleDateString('es-CL', {
                  day: '2-digit',
                  month: 'long',
                  year: 'numeric',
                })
              : '';
          } catch (e) {}

          return h('div', { className: 'pv-wrap' }, [
            category ? h('span', { className: 'pv-tag', key: 'tag' }, category) : null,
            h('h1', { className: 'pv-title', key: 'title' }, title || 'Sin título'),
            h('p', { className: 'pv-meta', key: 'meta' }, [
              author ? h('b', { key: 'a' }, author) : null,
              author ? ' — ' : '',
              dateStr,
            ]),
            h(HeroImg, {
              key: 'hero',
              path: hero,
              position: pos,
              getAsset: this.props.getAsset,
            }),
            h('div', { className: 'pv-body', key: 'body' }, this.props.widgetFor('body')),
            bioLines.length
              ? h('div', { className: 'pv-author', key: 'bio' }, [
                  h('p', { className: 'pv-author-label', key: 'l' }, '// sobre el autor'),
                  author ? h('p', { className: 'pv-author-name', key: 'n' }, author) : null,
                  h(
                    'div',
                    { className: 'pv-author-bio', key: 'b' },
                    bioLines.map(function (p, i) {
                      return h('p', { key: i }, p);
                    })
                  ),
                ])
              : null,
            citeLines.length
              ? h('div', { className: 'pv-cites', key: 'cites' }, [
                  h('p', { className: 'pv-cites-label', key: 'l' }, '// obras citadas'),
                  h(
                    'ul',
                    { className: 'pv-cites-list', key: 'u' },
                    citeLines.map(function (c, idx) {
                      return h('li', { className: 'pv-cites-item', key: idx }, c);
                    })
                  ),
                ])
              : null,
            h('p', { className: 'pv-end', key: 'end' }, '// fin del texto'),
          ]);
        },
      });

      var PrensaPreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var data = entry.get('data');
          var title = data.get('title') || 'Sin título';
          var type = data.get('type') || 'Lanzamiento';
          var eventDates = data.get('eventDates');
          var location = data.get('location');
          var hero = data.get('heroImage');
          var pos = data.get('imagePosition') || 'center';
          var summary = data.get('summary');
          var author = data.get('author');
          var authorBio = data.get('authorBio');
          var authorImage = data.get('authorImage');

          return h('div', { className: 'pv-wrap' }, [
            h('span', { className: 'pv-tag', key: 'type' }, type),
            h('h1', { className: 'pv-title', key: 'title' }, title),
            h('p', { className: 'pv-meta', key: 'meta' }, [
              eventDates ? h('span', { key: 'd' }, eventDates) : null,
              (eventDates && location) ? ' · ' : '',
              location ? h('b', { key: 'l' }, location) : null,
            ]),
            summary ? h('p', { style: { fontStyle: 'italic', margin: '1rem 0', color: '#554d42' }, key: 's' }, summary) : null,
            h(HeroImg, {
              key: 'hero',
              path: hero,
              position: pos,
              getAsset: this.props.getAsset,
            }),
            h('div', { className: 'pv-body', key: 'body' }, this.props.widgetFor('body')),
            (authorBio || authorImage) ? h('div', {
              key: 'author-box',
              style: {
                marginTop: '2rem',
                padding: '1.2rem',
                background: '#0e0e0e',
                color: '#fbf8ef',
                border: '2px solid #0e0e0e',
              }
            }, [
              h('p', { key: 'lbl', style: { color: '#ff3366', fontSize: '0.72rem', textTransform: 'uppercase', margin: '0 0 0.5rem' } }, 'sobre la autora / autor'),
              author ? h('h4', { key: 'nm', style: { margin: '0 0 0.4rem', color: '#fbf8ef' } }, author) : null,
              authorBio ? h('p', { key: 'bio', style: { margin: 0, fontSize: '0.88rem', color: '#d8ccb6' } }, authorBio) : null,
            ]) : null,
          ]);
        },
      });

      CMS.registerPreviewTemplate('posts', PostPreview);
      CMS.registerPreviewTemplate('prensa', PrensaPreview);
    </script>
  </body>
</html>
